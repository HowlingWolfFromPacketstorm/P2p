; php2shell rawkey lab (CVE-2026-109618)
;
; display_errors=On is what makes the out-of-memory path observable and
; lets the out-of-bounds read reach the Set-Cookie header; memory_limit=8M
; is what an oversized field name has to exceed.
;
; Mitigations from the official advisory, for comparison:
;   memory_limit = -1              -> no OOM, the chain never starts
;   fatal_error_backtraces = 0     -> PHP 8.5 only, removes the leak producer
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
memory_limit = 8M
post_max_size = 64M
upload_max_filesize = 64M
session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
